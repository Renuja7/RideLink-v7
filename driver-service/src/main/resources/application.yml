server:
  port: 8082

spring:
  application:
    name: driver-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:ridelink_driver}

jwt:
  secret: ${JWT_SECRET:RideLinkSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong123456}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ridelink: DEBUG
