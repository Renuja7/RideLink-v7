server:
  port: 8081

spring:
  application:
    name: account-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:ridelink_account}
  main:
    allow-bean-definition-overriding: true

jwt:
  secret: ${JWT_SECRET:RideLinkSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ridelink: DEBUG
