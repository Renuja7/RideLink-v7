server:
  port: 8084

spring:
  application:
    name: payment-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:ridelink_payment}

jwt:
  secret: ${JWT_SECRET:RideLinkSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong123456}

fare:
  base-fare: 200
  rate-per-km: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ridelink: DEBUG
