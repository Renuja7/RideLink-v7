server:
  port: 8083

spring:
  application:
    name: ride-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:ridelink_ride}
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 5000

jwt:
  secret: ${JWT_SECRET:RideLinkSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong123456}

services:
  driver-service:
    url: ${DRIVER_SERVICE_URL:http://localhost:8082}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8084}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ridelink: DEBUG
